<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multihood | Multichain Aggregator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-white p-6">

    <div class="glass p-10 rounded-3xl w-full max-w-lg shadow-2xl text-center">
        <img src="logo.png" alt="Multihood Logo" class="w-24 h-24 mx-auto mb-6 rounded-full border-2 border-green-500">
        
        <h1 class="text-4xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-green-600">Multihood</h1>
        <p class="text-gray-400 mb-8">Execute your 7-in-1 workflow on Robinhood Testnet with one click.</p>
        
        <button id="connectBtn" class="w-full py-4 mb-4 rounded-xl font-bold bg-white text-black hover:bg-gray-200 transition">
            Connect Wallet
        </button>
        
        <button id="runWorkflowBtn" class="w-full py-6 rounded-xl font-bold text-lg bg-green-500 hover:bg-green-400 transition shadow-lg shadow-green-500/20">
            Execute 7-in-1 Workflow
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
